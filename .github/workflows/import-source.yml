name: Import upstream template files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ryzent repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy source repository contents
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/HasnainIrfan/3d-portfolio.git /tmp/ryzent-source
          rsync -a --delete --exclude='.git' /tmp/ryzent-source/ ./
          # Remove the temporary importer from the imported project.
          rm -f .github/workflows/import-source.yml
          find .github/workflows -maxdepth 1 -type f -print -quit | grep -q . || rmdir .github/workflows || true
          find .github -maxdepth 1 -type f -print -quit | grep -q . || rmdir .github || true

      - name: Commit complete source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi
          git commit -m "Import upstream 3D portfolio template"
          git push origin HEAD:main
